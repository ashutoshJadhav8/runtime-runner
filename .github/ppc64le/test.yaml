name: PPC64LE Build Report

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ppc64le-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ppc64le-sync:
    runs-on: ubuntu-latest
    outputs:
      workflow_start_time: ${{ steps.capture-start.outputs.start_time }}

    steps:
      - name: Capture workflow start time
        id: capture-start
        run: |
          echo "start_time=$(TZ=Asia/Kolkata date +"%I:%M %p")" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  ppc64le-runtime-build-test:
    needs: ppc64le-sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔧 Replace these with your real build/test steps
      - name: Build
        run: |
          echo "build done"

      - name: Test
        run: |
          echo "test done"

  ppc64le-report:
    needs: [ppc64le-sync, ppc64le-runtime-build-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update HTML report
        run: |
          REPORT=".github/ppc64le/report.html"
          mkdir -p "$(dirname "$REPORT")"

          # Create base HTML if missing or empty
          if [[ ! -s "$REPORT" ]]; then
            cat <<'EOF' > "$REPORT"
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Build Status Report</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 10px; vertical-align: top; }
        th { background-color: #f2f2f2; }
        .success { background-color: #e6f9e6; color: #1b5e20; }
        .failure { background-color: #fdeaea; color: #8a1c1c; }
        .status hr { margin: 10px 0; }
        .status-grid {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr;
            gap: 6px 20px;
            margin-top: 5px;
        }
        .label { font-weight: bold; }
    </style>
</head>
<body>

<h2>Report</h2>

<table>
<thead>
<tr>
<th>Date</th>
<th>Start Time</th>
<th>End Time</th>
<th>Status</th>
</tr>
</thead>
<tbody>
</tbody>
</table>

</body>
</html>
EOF
          fi

          DATE=$(TZ=Asia/Kolkata date +"%d/%m/%Y")
          START_TIME="${{ needs.ppc64le-sync.outputs.workflow_start_time }}"
          END_TIME=$(TZ=Asia/Kolkata date +"%I:%M %p")

          BUILD_STATUS="${{ needs.ppc64le-runtime-build-test.result }}"
          TEST_STATUS="${{ needs.ppc64le-runtime-build-test.result }}"

          if [[ "$BUILD_STATUS" == "success" && "$TEST_STATUS" == "success" ]]; then
            ROW_CLASS="success"
            STATUS_MSG="Runtime build is successful, test result"
          else
            ROW_CLASS="failure"
            STATUS_MSG="Runtime build or test failed"
          fi

          # 🔧 Replace with parsed values if available
          TOTAL=246
          PASSED="243 (98.00%)"
          FAILED="0 (0%)"
          SKIPPED="3 (1.00%)"

          ROW=$(cat <<EOF
<tr class="$ROW_CLASS">
<td>$DATE</td>
<td>$START_TIME</td>
<td>$END_TIME</td>
<td class="status">
$STATUS_MSG
<hr>
<div class="status-grid">
<div class="label">Total Test Cases :</div><div>$TOTAL</div>
<div class="label">Test Passed :</div><div>$PASSED</div>
<div class="label">Test Failed :</div><div>$FAILED</div>
<div class="label">Test Skipped :</div><div>$SKIPPED</div>
</div>
</td>
</tr>
EOF
          )

          TMP=$(mktemp)
          echo "$ROW" > "$TMP"
          sed -i "/<tbody>/r $TMP" "$REPORT"
          rm -f "$TMP"

          echo "HTML updated successfully:"
          grep -n "<tr" "$REPORT"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ppc64le/report.html
          git commit -m "Update ppc64le build report" || echo "No changes to commit"
          git push
