name: Sync Fork from Upstream (Safe Merge)

on:
  # schedule:
  #   - cron: '* * * * *'   # Every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-main
  cancel-in-progress: true

jobs:
  
  ppc64le-runtime-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: just run
        run: echo "ashu"
  
  ppc64le-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-app[bot]"
          git config user.email "github-app[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/alhad-deshpande/runtime.git || true
          git fetch upstream

      - name: Sync main safely
        run: |
          git checkout main
          git pull origin main
          git merge upstream/main --no-edit || true
          git push origin main

  ppc64le-result-status:
    needs: [ppc64le-sync, ppc64le-runtime-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Set timestamps and workflow status
        id: status
        run: |
          # Date and time
          TRIGGER_DATE=$(date -u +"%Y-%m-%d")
          START_TIME=${{ needs.ppc64le-runtime-build-test.started_at }}
          END_TIME=${{ needs.ppc64le-runtime-build-test.completed_at }}
          BUILD_STATUS=${{ needs.ppc64le-runtime-build-test.result }}
          TEST_STEP_STATUS="unknown"
          if [[ "${{ needs.ppc64le-runtime-build-test.result }}" == "success" ]]; then
            TEST_STEP_STATUS="success"
          else
            TEST_STEP_STATUS="failure"
          fi
          MESSAGE="Trigger Date: $TRIGGER_DATE\nStart Time: $START_TIME\nEnd Time: $END_TIME\nBuild Status: $BUILD_STATUS\nTest Status: $TEST_STEP_STATUS"
          echo "$MESSAGE" > workflow_status.txt
          echo "workflow_message=$MESSAGE" >> $GITHUB_OUTPUT
  
      - name: Upload workflow_status.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow_status
          path: workflow_status.txt
  
      - name: Comment workflow status on PR
        if: github.event.issue.pull_request
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PPC64LE_GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('workflow_status.txt', 'utf8');
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
