  ppc64le-runtime-build-test:
    needs: ppc64le-sync
    # if: needs.ppc64le-trigger.outputs.command == 'build'
    runs-on: ubuntu-latest
    steps:
      # - name: Get PR SHA
      #   id: get_pr
      #   if: github.event.issue.pull_request
      #   uses: actions/github-script@v6
      #   with:
      #     script: |
      #       const prUrl = context.payload.issue.pull_request.url;
      #       const pr = await github.request(prUrl);
      #       const sha = pr.data.base.sha;
      #       core.setOutput("sha", sha);
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Container
        run: |
          docker stop github-api && docker rm github-api
          docker run -dit --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:ro --network host --name github-api ubuntu:22.04
      - name: Copy script
        run: |
          docker cp .github/workflows/ppc64le-runtime.sh github-api:/runtime.sh
          docker exec github-api chmod +x /runtime.sh
      - name: Build
        run: |
          docker exec github-api bash -c "/runtime.sh --build | tee /tmp/runtime-build.log; exit \${PIPESTATUS[0]}"
      - name: Test
        run: |
          docker exec github-api bash -c "/runtime.sh --test | tee /tmp/runtime-test.log; exit \${PIPESTATUS[0]}"
      - name: Copy test result summary from container
        run: |
          rm -rf ./Script-details
          docker cp github-api:/Script-details ./Script-details
      - name: Upload Script-details artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Script-details
          path: ./Script-details

  ppc64le-result-status:
    needs: [ppc64le-sync, ppc64le-runtime-build-test]
    # if: >
    #   always() &&
    #   needs.ppc64le-trigger.outputs.command == 'build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set failure flag
        id: check-status
        run: echo "status=${{ needs.ppc64le-runtime-build-test.result }}" >> $GITHUB_OUTPUT
      - name: Download Script-details artifact
        uses: actions/download-artifact@v4
        with:
          name: Script-details
          path: .
        continue-on-error: true
      - name: Check if Script-details file exists
        id: script-check
        run: |
          if [[ -f "Script-details" ]]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Set workflow status summary
        run: |
          TRIGGER_DATE=$(TZ=Asia/Kolkata date -u +"%Y-%m-%d")
          START_TIME="${{ needs.ppc64le-sync.outputs.workflow_start_time }}"
          END_TIME=$(TZ=Asia/Kolkata date +"%H:%M:%S")
          BUILD_STATUS="${{ needs.ppc64le-runtime-build-test.result }}"
          TEST_STATUS="${{ needs.ppc64le-runtime-build-test.result }}"
          cat <<EOF >> workflow_status
          Trigger Date: ${TRIGGER_DATE}
          Start Time: ${START_TIME}
          End Time: ${END_TIME}
          Build Status: ${BUILD_STATUS}
          Test Status: ${TEST_STATUS}
          EOF
          cat Script-details >> workflow_status
          echo "------------------------------------------------------------------" >> workflow_status
          cat workflow_status
      
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Update HTML build report (from workflow_status)
        run: |
          REPORT_FILE="build-report.html"
      
          if [ ! -f "$REPORT_FILE" ]; then
            echo "ERROR: build-report.html not found"
            exit 1
          fi
          DATE=$(grep "Trigger Date" workflow_status | cut -d: -f2- | xargs)
          START_TIME=$(grep "Start Time" workflow_status | cut -d: -f2- | xargs)
          END_TIME=$(grep "End Time" workflow_status | cut -d: -f2- | xargs)
          BUILD_STATUS=$(grep "Build Status" workflow_status | cut -d: -f2- | xargs)
          TEST_STATUS=$(grep "Test Status" workflow_status | cut -d: -f2- | xargs)
          if [[ "$BUILD_STATUS" == "success" && "$TEST_STATUS" == "success" ]]; then
            ROW_CLASS="success"
            STATUS_MSG="Runtime build is successful, test result"
          else
            ROW_CLASS="failure"
            STATUS_MSG="Runtime build or test failed"
          fi      
          TOTAL=$(grep "Total Test Cases" workflow_status | awk -F: '{print $2}' | xargs)
          PASSED=$(grep "Test Passed" workflow_status | awk '{print $4}')
          PASS_AVG=$(grep "Test Passed" workflow_status | awk -F'[()]' '{print $2}')
          FAILED=$(grep "Test Failed" workflow_status | awk '{print $4}')
          FAIL_AVG=$(grep "Test Failed" workflow_status | awk -F'[()]' '{print $2}')
          SKIPPED=$(grep "Test Skipped" workflow_status | awk '{print $4}')
          SKIP_AVG=$(grep "Test Skipped" workflow_status | awk -F'[()]' '{print $2}')
          ROW=$(cat <<EOF
          <tr class="$ROW_CLASS">
          <td>$DATE</td>
          <td>$START_TIME</td>
          <td>$END_TIME</td>
          <td>
          $STATUS_MSG
          <hr>
          <div class="status-grid">
            <div class="label">Total Test Cases :</div><div>$TOTAL</div>
            <div class="label">Test Passed :</div><div>$PASSED ($PASS_AVG)</div>
            <div class="label">Test Failed :</div><div>$FAILED ($FAIL_AVG)</div>
            <div class="label">Test Skipped :</div><div>$SKIPPED ($SKIP_AVG)</div>
          </div>
          </td>
          </tr>
          EOF
          )
          TMP_ROW_FILE=$(mktemp)
          echo "$ROW" > "$TMP_ROW_FILE"
          sed -i "/<\/tbody>/r $TMP_ROW_FILE" "$REPORT_FILE"
          rm -f "$TMP_ROW_FILE"          
          pwd
          ls -la
          ls -la ../
          git config user.name "github-app[bot]"
          git config user.email "github-app[bot]@users.noreply.github.com"
          git add workflow_status
          git commit -m "Add ppc64le workflow status summary" || echo "No changes to commit"
          git push
    
