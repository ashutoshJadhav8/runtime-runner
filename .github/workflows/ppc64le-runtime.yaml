name: Trigger ppc64le build on GHA on my repo

on:
  issue_comment:
    types: [created, edited]
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ppc64le-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Capture workflow start time
        id: capture-start
        run: |
          echo "start_time=$(TZ=Asia/Kolkata date +"%H:%M:%S")" >> $GITHUB_OUTPUT

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-app[bot]"
          git config user.email "github-app[bot]@users.noreply.github.com"
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/alhad-deshpande/runtime.git || true
          git fetch upstream
      - name: Sync main safely
        run: |
          git checkout main
          git pull origin main
          git merge upstream/main --no-edit || true
          git push origin main
