name: Sync Fork With Upstream

on:
  schedule:
    - cron: "0 * * * *"  # run every hour (change as needed)
  workflow_dispatch:     # allow manual trigger

permissions:
  contents: write        # allow push commits
  pull-requests: write   # allow PR creation (optional)

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # fetch full history
          persist-credentials: false

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dotnet/runtime.git
          git fetch upstream

      - name: Merge upstream
        run: |
          git checkout main
          git merge upstream/main --ff-only

      - name: Commit & push
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: actions@github.com
        run: |
          git push "https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git" main

