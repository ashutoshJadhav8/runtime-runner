name: Runtime-build-test

on:
  pull_request:
    branches:
      - workFlow

jobs:
  PR-Check:
    name: Check PR for @ASHU_JD
    runs-on: ashu-runner-self-hosted
    outputs:
      run_job: ${{ steps.set_output.outputs.run_job }}
    steps:
      - name: Check if PR title or body contains @ASHU_JD
        id: check_pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            const shouldRun = title.includes("@ASHU_JD") || body.includes("@ASHU_JD");
            core.setOutput("run_job", shouldRun);

      - name: Set output
        id: set_output
        run: echo "run_job=${{ steps.check_pr.outputs.run_job }}" >> $GITHUB_OUTPUT

  Runtime-Build-Test:
    name: Runtime Build and Test
    needs: check-pr
    if: needs.check-pr.outputs.run_job == 'true'
    runs-on: ashu-runner-self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Container
        run: |
          docker stop github-api && docker rm github-api
          docker run -dit --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:ro --name github-api ubuntu:22.04
      - name: Copy script
        run: |
          docker cp .github/workflows/ppc64le-runtime.sh github-api:/runtime.sh
          docker exec github-api chmod +x /runtime.sh
      - name: Build
        run: |
          docker exec github-api bash -c "/runtime.sh --ref release/9.0 --build 2>&1 | tee /tmp/runtime-build.log; exit \${PIPESTATUS[0]}"
      - name: Test
        run: |
          docker exec github-api bash -c "/runtime.sh --ref release/9.0 --test 2>&1 | tee /tmp/runtime-test.log; exit \${PIPESTATUS[0]}"