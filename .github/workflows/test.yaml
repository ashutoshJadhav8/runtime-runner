name: Runtime-Build-Test

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

jobs:
  CheckPoint:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@Dotnet_ppc64le build') || contains(github.event.comment.body, '@Dotnet_ppc64le cancel')
    outputs:
      command: ${{ steps.check_comment.outputs.command }}
    steps:
      - name: Parse comment
        id: check_comment
        uses: actions/github-script@v6
        with:
          script: |
            const comment = context.payload.comment.body || "";
            let command = "";

            if (comment.includes("@Dotnet_ppc64le cancel")) {
              command = "cancel";
            } else if (comment.includes("@Dotnet_ppc64le build")) {
              command = "build";
            }

            core.setOutput("command", command);

  runtime-build-test:
    needs: CheckPoint
    if: needs.CheckPoint.outputs.command == 'build'
    runs-on: ashu-runner-self-hosted
    steps:
      - name: Get PR SHA
        id: get_pr
        if: github.event.issue.pull_request
        uses: actions/github-script@v6
        with:
          script: |
            const prUrl = context.payload.issue.pull_request.url;
            const pr = await github.request(prUrl);
            const sha = pr.data.head.sha;
            core.setOutput("sha", sha);

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Container
        run: |
          docker stop github-api && docker rm github-api
          docker run -dit --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:ro --network host --name github-api ubuntu:22.04

      - name: Copy script
        run: |
          docker cp /root/ashutosh/api/runtime-runner/.github/workflows/runtime.sh github-api:/runtime.sh
          docker exec github-api chmod +x /runtime.sh

      - name: Build
        run: |
          docker exec github-api bash -c "/runtime.sh --ref ${{ steps.get_pr.outputs.sha }} --build 2>&1 | tee /build.log; exit \${PIPESTATUS[0]}"

      - name: Copy test result summary from container
        run: |
          rm -rf ./test-summary.txt
          docker cp github-api:/test-summary.txt ./test-summary.txt

      - name: Upload Script-details artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary.txt
          path: ./test-summary.txt

  ppc64le-result-status:
    needs: runtime-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Set failure flag
        id: check-status
        run: echo "status=${{ needs.ppc64le-runtime-build-test.result }}" >> $GITHUB_OUTPUT

      - name: Download test-summary.txt artifact
        if: steps.check-status.outputs.status == 'success'
        uses: actions/download-artifact@v4
        with:
          name: script-details
          path: .

      - name: Comment success test summary on PR
        if: steps.check-status.outputs.status == 'success'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_WORK }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test-summary.txt', 'utf8');
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Comment failure message on PR
        if: steps.check-status.outputs.status != 'success'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_WORK }}
          script: |
            const runId = process.env.GITHUB_RUN_ID;
            const repo = process.env.GITHUB_REPOSITORY;
            const jobUrl = `https://github.com/${repo}/actions/runs/${runId}`;
            const issue_number = context.issue.number;
            const body = `🚨 The **ppc64le runtime build and test** job has **failed**.\n\n🔗 [View failing job logs](${jobUrl})`;
            await github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
