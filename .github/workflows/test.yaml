name: Sync with upstream repo

on:
  schedule:
    # Every Saturday at 11:00 PM UTC
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write   # 🔑 REQUIRED for pushing code
  workflows: write 

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/alhad-deshpande/runtime.git
          git fetch upstream

      - name: Merge upstream main into fork main
        run: |
          git checkout main
          git merge upstream/main --no-edit

      - name: Push changes to fork
        run: |
          git push origin main
