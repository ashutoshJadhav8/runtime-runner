name: Sync with upstream repo

on:
  schedule:
    # Every Saturday at 11:00 PM UTC
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write   # 🔑 REQUIRED for pushing code
  actions: write 

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/alhad-deshpande/runtime.git
          git fetch upstream

      - name: Rebase fork main onto upstream main
        run: |
          git checkout main
          git rebase upstream/main

      - name: Push rebased changes to fork
        run: |
          git push origin main --force
