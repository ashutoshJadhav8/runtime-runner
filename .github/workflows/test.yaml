name: Runtime-build-test

on:
  pull_request:
    branches:
      - workFlow

jobs:
  runtime-build-test:
    runs-on: ashu-runner-self-hosted

    steps:
      - name: Check if PR title or body contains @ASHU_JD
        id: check_pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            return title.includes("@ASHU_JD") || body.includes("@ASHU_JD");

      - name: Stop if PR does not contain @ASHU_JD
        if: steps.check_pr.outputs.result != 'true'
        run: |
          echo "PR does not contain @ASHU_JD, skipping job."
          exit 0

      - name: Run container steps
        if: steps.check_pr.outputs.result == 'true'
        run: |
          docker stop github-api && docker rm github-api || true
          docker run -dit --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:ro --name github-api ubuntu:22.04
          ls -la && ls -la ../ && pwd
          docker cp $(pwd)/.github/workflows/ppc64le-runtime.sh github-api:/runtime.sh
          docker exec github-api chmod +x /runtime.sh
          docker exec github-api bash -c "/runtime.sh --build 2>&1 | tee /tmp/runtime-build.log; exit \${PIPESTATUS[0]}"
          docker exec github-api bash -c "/runtime.sh --test 2>&1 | tee /tmp/runtime-test.log; exit \${PIPESTATUS[0]}"

