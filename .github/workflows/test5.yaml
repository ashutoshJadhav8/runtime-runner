name: Trigger Jenkins on Mention

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  trigger-comment-job:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&  # ✅ ensures it's a PR comment
      github.event.comment.body != '' &&
      contains(github.event.comment.body, '@Dotnet_ppc64le')
    steps:
      - name: Print trigger info
        run: echo "Triggered by PR comment: @Dotnet_ppc64le"

      - name: Run PPC64LE Build (example)
        run: echo "Running Dotnet PPC64LE build tasks..."
